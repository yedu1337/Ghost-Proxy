name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build stage dist
          mkdir -p build/windows build/linux stage dist

          echo "Building Windows binaries..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o build/windows/GhostProxy.exe ./cmd/client
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o build/windows/GhostProxy-Server.exe ./cmd/server

          echo "Building Linux binaries..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o build/linux/GhostProxy ./cmd/client
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o build/linux/ghost-proxy-server ./cmd/server

          echo "Packaging Windows client..."
          mkdir -p stage/windows-client
          cp build/windows/GhostProxy.exe stage/windows-client/
          cp "packaging/windows/GhostProxy Settings.bat" stage/windows-client/
          cp "packaging/windows/Test Ghost Proxy.bat" stage/windows-client/
          cp packaging/windows/README.txt stage/windows-client/README.txt
          cp LICENSE stage/windows-client/LICENSE.txt
          sed -i 's/$/\r/' stage/windows-client/README.txt stage/windows-client/"GhostProxy Settings.bat" stage/windows-client/"Test Ghost Proxy.bat"
          (cd stage/windows-client && zip -qr ../../dist/GhostProxy-Client-Windows-x64.zip .)

          echo "Packaging Windows server..."
          mkdir -p stage/windows-server/configs
          cp build/windows/GhostProxy-Server.exe stage/windows-server/
          cp configs/server.yaml stage/windows-server/configs/
          cp packaging/server/start-ghost-proxy-server.bat stage/windows-server/
          cp "packaging/server/GhostProxy Server Settings.bat" stage/windows-server/
          cp packaging/server/README.txt stage/windows-server/README.txt
          cp packaging/server/ghost.env.example stage/windows-server/ghost.env.example
          cp LICENSE stage/windows-server/LICENSE.txt
          sed -i 's/$/\r/' stage/windows-server/README.txt stage/windows-server/ghost.env.example stage/windows-server/start-ghost-proxy-server.bat stage/windows-server/"GhostProxy Server Settings.bat"
          (cd stage/windows-server && zip -qr ../../dist/GhostProxy-Server-Windows-x64.zip .)

          echo "Packaging Linux client..."
          mkdir -p stage/linux-client
          cp build/linux/GhostProxy stage/linux-client/ghost-proxy
          cp packaging/linux/start-ghost-proxy.sh stage/linux-client/
          cp packaging/linux/ghost-proxy-settings.sh stage/linux-client/
          cp packaging/linux/test-ghost-proxy.sh stage/linux-client/
          cp packaging/linux/README.txt stage/linux-client/README.txt
          cp LICENSE stage/linux-client/LICENSE.txt
          chmod +x stage/linux-client/ghost-proxy stage/linux-client/*.sh
          tar -C stage/linux-client -czf dist/GhostProxy-Client-Linux-x64.tar.gz .

          echo "Packaging Linux server..."
          mkdir -p stage/linux-server/configs
          cp build/linux/ghost-proxy-server stage/linux-server/
          cp configs/server.yaml stage/linux-server/configs/
          cp packaging/server/start-ghost-proxy-server.sh stage/linux-server/
          cp packaging/server/ghost-proxy-server-settings.sh stage/linux-server/
          cp packaging/server/README.txt stage/linux-server/README.txt
          cp packaging/server/ghost.env.example stage/linux-server/ghost.env.example
          cp deployments/systemd/install.sh stage/linux-server/
          cp deployments/systemd/ghost-proxy.service stage/linux-server/
          cp deployments/systemd/certbot-deploy-hook.sh stage/linux-server/
          cp deployments/systemd/ghost-proxy-certbot-renew.service stage/linux-server/
          cp deployments/systemd/ghost-proxy-certbot-renew.timer stage/linux-server/
          cp LICENSE stage/linux-server/LICENSE.txt
          chmod +x stage/linux-server/ghost-proxy-server stage/linux-server/*.sh
          tar -C stage/linux-server -czf dist/GhostProxy-Server-Linux-x64.tar.gz .

          echo "Writing checksums..."
          (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)

          ls -lh dist

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Ghost Proxy ${{ github.ref_name }}
          body: |
            ## Downloads

            **End users (client only):**
            - Windows: `GhostProxy-Client-Windows-x64.zip`
            - Linux: `GhostProxy-Client-Linux-x64.tar.gz`

            **Server operators:**
            - Windows: `GhostProxy-Server-Windows-x64.zip`
            - Linux: `GhostProxy-Server-Linux-x64.tar.gz`

            **Linux gateway (recommended):** extract the Linux server package and
            run `sudo ./install.sh`. It can get a free trusted Let's Encrypt
            certificate for a public IP address, so no domain is required.

            Verify downloads with `SHA256SUMS.txt`.

            The client asks for the server address, CA certificate (if needed),
            and PSK on first run. Use `--check` or the included test launcher
            to verify the connection. See the README inside each package.

            These builds are not code-signed. Windows SmartScreen may ask you
            to confirm before running the client or server.
          files: dist/*
