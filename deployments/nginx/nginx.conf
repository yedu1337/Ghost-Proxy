pid /tmp/nginx.pid;
events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /health {
            default_type text/plain;
            return 200 "ghost-nginx-ok\n";
        }
    }
}
