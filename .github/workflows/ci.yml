name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Verify go.mod/go.sum are tidy
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "::error::go.mod/go.sum are not tidy - run 'go mod tidy' and commit the result" && exit 1)

      - name: gofmt check
        if: runner.os == 'Linux'
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::The following files are not gofmt'd:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Staticcheck
        if: runner.os == 'Linux'
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "2026.2.2"
          install-go: false

      - name: Build
        run: go build ./...

      - name: Test (Linux, race + coverage)
        if: runner.os == 'Linux'
        run: go test ./... -race -cover

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test ./... -count=1
